services:
  - type: web
    name: setu-demo
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build
    startCommand: cd backend && python ../scripts/seed_demo_data.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SETU_DEMO_ADMIN_PASS
        sync: false
      - key: SETU_DEMO_TEACHER_8A_PASS
        sync: false
      - key: SETU_DEMO_TEACHER_8B_PASS
        sync: false
      - key: SETU_DEMO_REVIEWER_PASS
        sync: false
      - key: SETU_DEMO_STUDENT_PIN
        sync: false
